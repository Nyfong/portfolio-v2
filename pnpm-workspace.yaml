# Allow sharp to run its (prebuilt-binary) install script so pnpm's
# pre-run dependency check doesn't fail with ERR_PNPM_IGNORED_BUILDS.
onlyBuiltDependencies:
  - sharp

# Security overrides — moved here from package.json's "pnpm.overrides",
# which pnpm 10+ no longer reads. Pins patched versions of transitive deps.
overrides:
  'loader-utils@<1.4.1': '>=1.4.1'
  'loader-utils@>=1.0.0 <1.4.2': '>=1.4.2'
  'node-fetch@<2.6.7': '>=2.6.7'
  'node-fetch@>=2.0.0 <2.6.1': '>=2.6.1'
  'path-to-regexp@>=2.0.0 <3.3.0': '>=3.3.0'
  'cookie@<0.7.0': '>=0.7.0'
  'on-headers@<1.1.0': '>=1.1.0'
  'send@<0.19.0': '>=0.19.0'
  'next@>=16.0.0-canary.0 <16.0.7': '>=16.0.7'
  'next@>=16.0.0-beta.0 <16.0.9': '>=16.0.9'
  'lodash@>=4.0.0 <=4.17.22': '>=4.17.23'
  'next@>=15.6.0-canary.0 <16.1.5': '>=16.1.5'
  'next@>=16.0.0-beta.0 <16.0.11': '>=16.0.11'
  'js-yaml@<3.14.2': '>=3.14.2'
  'next@>=16.0.0-beta.0 <16.1.5': '>=16.1.5'
  'mdast-util-to-hast@>=13.0.0 <13.2.1': '>=13.2.1'
  'yaml@>=2.0.0 <2.8.3': '>=2.8.3'
